<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>XXD Panel 040</title>
  <desc>Truthful real-world anchor, tiny black-line figures, handwritten wit, generous whitespace, and five-language documentation.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF9ED"/>
      <stop offset="0.62" stop-color="#F5ECD9"/>
      <stop offset="1" stop-color="#EBDEC7"/>
    </linearGradient>
    <radialGradient id="orange" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(935 169) rotate(115) scale(142 132)">
